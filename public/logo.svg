<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mnViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C084FC" />
      <stop offset="50%" stopColor="#8B5CF6" />
      <stop offset="100%" stopColor="#4C1D95" />
    </linearGradient>
    <linearGradient id="mnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
    <linearGradient id="orbitG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="50%" stopColor="#8B5CF6" />
      <stop offset="100%" stopColor="#06D6A0" />
    </linearGradient>
  </defs>

  <!-- Background Dark Capsule -->
  <rect width="100" height="100" rx="24" fill="#07090E" stroke="url(#orbitG)" stroke-width="2"/>

  <!-- Subsurface Waves -->
  <path d="M 26 70 A 26 26 0 0 0 74 70" fill="none" stroke="#06D6A0" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 18 80 A 36 36 0 0 0 82 80" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Orbit Track -->
  <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="url(#orbitG)" stroke-width="2" transform="rotate(-26 50 50)" stroke-dasharray="4 3"/>

  <!-- Satellite -->
  <g transform="rotate(-26 50 50) translate(50, 34)">
    <rect x="-6" y="-1.5" width="4" height="3" rx="0.5" fill="#38BDF8"/>
    <rect x="2" y="-1.5" width="4" height="3" rx="0.5" fill="#38BDF8"/>
    <rect x="-2" y="-2" width="4" height="4" rx="0.8" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Manganese Crystal Facets -->
  <polygon points="50,22 33,34 50,48" fill="url(#mnViolet)" stroke="#E9D5FF" stroke-width="1"/>
  <polygon points="50,22 67,34 50,48" fill="url(#mnGold)" stroke="#FDE047" stroke-width="1"/>
  <polygon points="33,34 33,64 50,48" fill="#1E1B4B" stroke="#6366F1" stroke-width="0.8"/>
  <polygon points="67,34 67,64 50,48" fill="url(#mnViolet)" stroke="#C084FC" stroke-width="0.8"/>
  <polygon points="33,64 50,78 50,48" fill="#0B0F19" stroke="#818CF8" stroke-width="0.8"/>
  <polygon points="67,64 50,78 50,48" fill="url(#mnGold)" stroke="#F59E0B" stroke-width="1"/>

  <!-- Center Nucleus -->
  <circle cx="50" cy="48" r="4" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <circle cx="50" cy="48" r="1.5" fill="#FDE047"/>
</svg>
